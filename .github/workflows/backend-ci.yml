name: CI

on:
  push:
    branches: ['**']
    # Release runs this workflow itself for these tags.
    tags-ignore: ['v*']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Exact source commit to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
      - name: Check release workflow policy
        run: ruby .github/checks/release-workflow-test.rb

  test:
    runs-on: ubuntu-latest
    services:
      monthcard-postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_USER: monthcard_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: monthcard_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U monthcard_test -d monthcard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        env:
          SCHEDULED_TEST_DSN: postgres://monthcard_test:isolated-test-password@127.0.0.1:55439/monthcard_test?sslmode=disable
          ACTIVITY_TEST_DSN: postgres://monthcard_test:isolated-test-password@127.0.0.1:55439/monthcard_test?sslmode=disable
          TEST_MODEL_ACCESS_DATABASE_URL: postgres://monthcard_test:isolated-test-password@127.0.0.1:55439/monthcard_test?sslmode=disable
        run: make test-integration
      - name: Month-card PostgreSQL concurrency and payment recovery
        working-directory: backend
        env:
          MONTHCARD_TEST_DSN: postgres://monthcard_test:isolated-test-password@127.0.0.1:55439/monthcard_test?sslmode=disable
          MONTHCARD_BILLING_TEST_DSN: postgres://monthcard_test:isolated-test-password@127.0.0.1:55439/monthcard_test?sslmode=disable
          MONTHCARD_PAYMENT_TEST_DSN: postgres://monthcard_test:isolated-test-password@127.0.0.1:55439/monthcard_test?sslmode=disable
        run: go test -race ./internal/monthcard -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

  # A reusable workflow can otherwise report success with skipped jobs.
  required:
    if: ${{ always() }}
    needs: [shell, test, frontend, golangci-lint, release-helpers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          CI_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$CI_RESULTS"
          for result in $CI_RESULTS; do
            if [ "$result" != success ]; then
              echo "CI did not pass: $CI_RESULTS" >&2
              exit 1
            fi
          done
  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
